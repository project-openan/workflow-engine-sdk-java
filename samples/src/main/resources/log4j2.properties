# log4j2 configuration (properties format - avoids JDK Xerces XMLConfigurationException)
status=WARN
# Log pattern
property.LOG_PATTERN=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%t] %logger{1} - %msg%n
# Console appender
appender.console.type=Console
appender.console.name=Console
appender.console.target=SYSTEM_OUT
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=${LOG_PATTERN}
# Rolling file appender
appender.file.type=RollingFile
appender.file.name=File
appender.file.fileName=logs/spn-demo.log
appender.file.filePattern=logs/spn-demo-%d{yyyy-MM-dd}-%i.log.gz
appender.file.append=true
appender.file.layout.type=PatternLayout
appender.file.layout.pattern=${LOG_PATTERN}
appender.file.policies.type=Policies
appender.file.policies.time.type=TimeBasedTriggeringPolicy
appender.file.policies.size.type=SizeBasedTriggeringPolicy
appender.file.policies.size.size=20MB
appender.file.strategy.type=DefaultRolloverStrategy
appender.file.strategy.max=10
# SDK diagnostic trace: full message content, SSE events, negotiation, extension handlers
logger.sdk.name=dev.openan.workflow.engine
logger.sdk.level=DEBUG
# Demo agents: negotiation rounds + business progress
logger.demo.name=dev.openan.workflow.engine.examples
logger.demo.level=DEBUG
# Underlying a2a-java SDK: reduce noise, keep warnings/errors
logger.a2a.name=org.a2aproject
logger.a2a.level=WARN
# Protocol-level message dumps: full request/response bodies + headers
logger.protocol.name=PROTOCOL
logger.protocol.level=INFO
# Root logger
rootLogger.level=INFO
rootLogger.appenderRef.console.ref=Console
rootLogger.appenderRef.file.ref=File
